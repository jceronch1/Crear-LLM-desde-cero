[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cero"
version = "1.0.0"
description = "Un LLM y su chatbot construidos desde cero, paso a paso, para enseñar y aprender. Funciona en CPU o GPU."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jhoni Cerón" }]
keywords = ["llm", "transformer", "chatbot", "pytorch", "educación", "español", "curso"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch se instala con `instalar.py`, que elige la variante correcta (CPU o CUDA) para cada
# equipo. Si alguien hace `pip install -e .` a mano, esta línea trae el PyTorch de PyPI.
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Leer el corpus real de cuentos en español (un archivo parquet de Hugging Face).
corpus = ["pyarrow>=17"]
# Los cuadernos del curso y sus gráficas.
curso = ["matplotlib>=3.8", "jupyterlab>=4.2", "ipykernel>=6.29"]
# Pruebas automáticas.
dev = ["pytest>=8"]
todo = ["pyarrow>=17", "matplotlib>=3.8", "jupyterlab>=4.2", "ipykernel>=6.29", "pytest>=8"]

[project.scripts]
cero = "cero.cli:main"

[project.urls]
"Código" = "https://github.com/jceronch1/Crear-LLM-desde-cero"
"Curso" = "https://github.com/jceronch1/Crear-LLM-desde-cero/tree/main/curso"

[tool.setuptools]
packages = ["cero", "cero.lab"]

[tool.setuptools.package-data]
"cero.lab" = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["lento: entrena de verdad durante unos segundos (se omite con -m 'not lento')"]
